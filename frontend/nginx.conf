server {
    # Port non privilegie : nginx tourne sans root.
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # L'application est une SPA : toute route inconnue retombe sur index.html,
    # sans quoi un rechargement sur /formateur renverrait un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le navigateur ne connait qu'une origine ; /api est relaye vers le backend.
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080/actuator/health;
    }

    # Les fichiers produits par Vite portent une empreinte dans leur nom.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
