spring.application.name=presences

# --- Base de donnees -------------------------------------------------------
# Aucun identifiant en dur, pas meme un repli de developpement : les trois
# valeurs viennent de l'environnement et l'application refuse de demarrer sans
# elles. docker compose les fournit depuis .env ; voir .env.example.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- JPA -------------------------------------------------------------------
# B5 : le schema est la propriete de Flyway, jamais d'Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# --- Format des erreurs ----------------------------------------------------
# RG25 : toute erreur sort au format { code, message }. On neutralise donc la
# page d'erreur par defaut de Spring et on laisse le RestControllerAdvice
# traiter jusqu'aux 404 de routage.
spring.mvc.problemdetails.enabled=false
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true
server.error.whitelabel.enabled=false

# --- Actuator --------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --- Journalisation --------------------------------------------------------
logging.level.org.flywaydb=INFO
