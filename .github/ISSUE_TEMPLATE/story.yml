name: Story utilisateur
description: Un résultat utile pour un utilisateur, formulé comme un résultat et non comme une tâche.
title: "[story] "
labels: ["should"]
body:
  - type: textarea
    id: resultat
    attributes:
      label: Résultat attendu
      description: Ce que l'utilisateur obtient une fois ce ticket livré. Formulé de son point de vue.
      placeholder: En tant qu'étudiant, je marque ma présence en saisissant le code affiché par le formateur.
    validations:
      required: true

  - type: textarea
    id: criteres
    attributes:
      label: Critères d'acceptation
      description: Un par ligne, sous la forme « Quand … alors … ». Vérifiables par un tiers.
      placeholder: |
        - Quand je saisis un code valide et non expiré, alors ma présence apparaît dans le tableau du formateur.
        - Quand je saisis un code déjà utilisé par moi, alors je reçois une erreur 409 DEJA_PRESENT.
    validations:
      required: true

  - type: input
    id: exigence
    attributes:
      label: Exigence fonctionnelle couverte
      description: Référence du cahier des charges, section 4.
      placeholder: EF1
    validations:
      required: true

  - type: input
    id: regles
    attributes:
      label: Règles de gestion concernées
      description: Références du cahier des charges, section 6. Séparées par des virgules.
      placeholder: RG1, RG4
    validations:
      required: true

  - type: dropdown
    id: priorite
    attributes:
      label: Priorité
      options: ["Must", "Should", "Could"]
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: Terminé quand
      description: Complément éventuel à la Definition of Done de CONTRIBUTING.md.
      placeholder: Le diagramme D3 reste cohérent avec les codes HTTP renvoyés.
