name: Intégration continue

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Une nouvelle poussée sur la même branche annule l'exécution précédente :
# inutile de payer une campagne de tests devenue obsolète.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  backend:
    name: Backend — build et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Vérifier que le wrapper est exécutable
        run: chmod +x backend/mvnw

      # verify enchaîne les tests unitaires (surefire) puis les tests
      # d'intégration (failsafe), qui démarrent un PostgreSQL par Testcontainers.
      # Le runner fournit Docker : aucune base n'est installée.
      - name: Construire et tester
        working-directory: backend
        run: ./mvnw -B --no-transfer-progress verify

      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-jacoco
          path: backend/target/site/jacoco/
          retention-days: 7

  frontend:
    name: Frontend — lint et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Analyser le code
        working-directory: frontend
        run: npm run lint

      - name: Vérifier les types
        working-directory: frontend
        run: npm run typecheck

      - name: Construire
        working-directory: frontend
        run: npm run build

  contrat:
    name: Contrat d'API — validité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cinq points du barème portent sur le contrat : une erreur de syntaxe
      # doit arrêter la chaîne, pas attendre la relecture.
      - name: Valider api/contrat.yaml
        run: npx --yes @redocly/cli@latest lint api/contrat.yaml --extends=minimal
