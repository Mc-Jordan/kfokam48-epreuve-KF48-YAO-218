name: Qualité — SonarCloud

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse et porte de qualité
    runs-on: ubuntu-latest
    # Sans le secret, l'analyse est sautée plutôt que mise en échec : une
    # contribution externe ne doit pas voir la chaîne rouge sans raison.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar a besoin de l'historique complet pour dater les lignes.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Mettre en cache le scanner Sonar
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      - name: Tester et analyser
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: backend
        run: |
          ./mvnw -B --no-transfer-progress verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Mc-Jordan_kfokam48-epreuve-KF48-YAO-218 \
            -Dsonar.organization=mc-jordan \
            -Dsonar.host.url=https://sonarcloud.io

      # Porte de qualité bloquante : une analyse qui échoue arrête la chaîne.
      - name: Attendre la porte de qualité
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: backend/target/sonar/report-task.txt
