name: Qualité — SonarCloud

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse et porte de qualité
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # Tant que le secret n'est pas posé, l'analyse est sautée explicitement
      # plutôt que mise en échec : une chaîne rouge pour une raison étrangère
      # à la qualité du code finit par être ignorée, et c'est là qu'on rate un
      # vrai problème. Le saut est visible dans le résumé de l'exécution.
      - name: Vérifier que le secret SONAR_TOKEN est disponible
        id: secret
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "### Analyse SonarCloud sautée" >> "$GITHUB_STEP_SUMMARY"
            echo "Le secret \`SONAR_TOKEN\` n'est pas défini sur ce dépôt." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.disponible == 'true'
        with:
          # Sonar a besoin de l'historique complet pour dater les lignes.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        if: steps.secret.outputs.disponible == 'true'
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Mettre en cache le scanner Sonar
        if: steps.secret.outputs.disponible == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      - name: Tester et analyser
        if: steps.secret.outputs.disponible == 'true'
        working-directory: backend
        run: |
          ./mvnw -B --no-transfer-progress verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Mc-Jordan_kfokam48-epreuve-KF48-YAO-218 \
            -Dsonar.organization=mcjordan \
            -Dsonar.host.url=https://sonarcloud.io

      # Porte de qualité bloquante : une analyse qui échoue arrête la chaîne.
      - name: Attendre la porte de qualité
        if: steps.secret.outputs.disponible == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        with:
          scanMetadataReportFile: backend/target/sonar/report-task.txt
