name: Qualité — SonarCloud

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse et porte de qualité
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # Tant que le secret n'est pas posé, l'analyse est sautée explicitement
      # plutôt que mise en échec : une chaîne rouge pour une raison étrangère
      # à la qualité du code finit par être ignorée, et c'est là qu'on rate un
      # vrai problème. Le saut est visible dans le résumé de l'exécution.
      - name: Vérifier que le secret SONAR_TOKEN est disponible
        id: secret
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "### Analyse SonarCloud sautée" >> "$GITHUB_STEP_SUMMARY"
            echo "Le secret \`SONAR_TOKEN\` n'est pas défini sur ce dépôt." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.disponible == 'true'
        with:
          # Sonar a besoin de l'historique complet pour dater les lignes.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        if: steps.secret.outputs.disponible == 'true'
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Mettre en cache le scanner Sonar
        if: steps.secret.outputs.disponible == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      - name: Tester et analyser
        if: steps.secret.outputs.disponible == 'true'
        working-directory: backend
        run: |
          ./mvnw -B --no-transfer-progress verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Mc-Jordan_kfokam48-epreuve-KF48-YAO-218 \
            -Dsonar.organization=mcjordan \
            -Dsonar.host.url=https://sonarcloud.io

      # Porte de qualité bloquante.
      #
      # L'action SonarSource/sonarqube-quality-gate-action rapportait « Quality
      # Gate not set for the project » alors que la porte « Sonar way » est bien
      # affectée — vérifié par l'API. On interroge donc l'API directement : une
      # vingtaine de lignes déterministes valent mieux qu'une dépendance externe
      # épinglée sur @master, qui peut changer sous nos pieds.
      - name: Attendre la porte de qualité
        if: steps.secret.outputs.disponible == 'true'
        working-directory: backend
        run: |
          set -euo pipefail

          URL_TACHE=$(grep '^ceTaskUrl=' target/sonar/report-task.txt | cut -d= -f2-)
          echo "Tâche d'analyse : $URL_TACHE"

          # L'analyse est asynchrone : on attend qu'elle quitte l'état PENDING.
          for tentative in $(seq 1 60); do
            ETAT=$(curl -sS -u "$SONAR_TOKEN:" "$URL_TACHE" | jq -r '.task.status')
            case "$ETAT" in
              SUCCESS) break ;;
              FAILED|CANCELED)
                echo "::error::L'analyse SonarCloud s'est terminée en échec ($ETAT)."
                exit 1 ;;
              *) echo "  analyse $ETAT… ($tentative/60)"; sleep 5 ;;
            esac
          done

          if [ "$ETAT" != "SUCCESS" ]; then
            echo "::error::L'analyse n'a pas abouti en cinq minutes."
            exit 1
          fi

          ID_ANALYSE=$(curl -sS -u "$SONAR_TOKEN:" "$URL_TACHE" | jq -r '.task.analysisId')
          PORTE=$(curl -sS -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/qualitygates/project_status?analysisId=$ID_ANALYSE")

          STATUT=$(echo "$PORTE" | jq -r '.projectStatus.status')
          echo "### Porte de qualité : $STATUT" >> "$GITHUB_STEP_SUMMARY"

          # Les conditions en échec sont listées dans le résumé : un « gate rouge »
          # sans motif oblige à rouvrir SonarCloud pour rien.
          echo "$PORTE" | jq -r '
            .projectStatus.conditions[]
            | select(.status == "ERROR")
            | "- **\(.metricKey)** : \(.actualValue) (seuil \(.comparator) \(.errorThreshold))"
          ' >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUT" != "OK" ]; then
            echo "::error::La porte de qualité est en échec ($STATUT)."
            exit 1
          fi
