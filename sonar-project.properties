sonar.projectKey=Mc-Jordan_kfokam48-epreuve-KF48-YAO-218
sonar.organization=mcjordan
sonar.projectName=KFOKAM48 - Presences et relectures
sonar.host.url=https://sonarcloud.io

# --- Perimetre ---------------------------------------------------------------
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.sourceEncoding=UTF-8

# --- Couverture --------------------------------------------------------------
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# --- Exclusions --------------------------------------------------------------
# Les DTO et les enregistrements de transport n'ont pas de logique a couvrir ;
# les mesurer abaisse la couverture sans rien apprendre sur la qualite.
sonar.coverage.exclusions=\
  backend/src/main/java/**/PresencesApplication.java,\
  backend/src/main/java/**/dto/**,\
  frontend/src/main.tsx,\
  frontend/src/api/types.ts

sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/dist/**
